<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Healing CI/CD Demo</title>
<style>
       *{
           margin:0;
           padding:0;
           box-sizing:border-box;
           font-family: Arial, sans-serif;
       }
       body{
           height:100vh;
           background: linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
           display:flex;
           justify-content:center;
           align-items:center;
           color:white;
       }
       .container{
           width:80%;
           max-width:900px;
           background: rgba(255,255,255,0.08);
           backdrop-filter: blur(10px);
           border-radius:20px;
           padding:40px;
           text-align:center;
           box-shadow:0 8px 30px rgba(0,0,0,0.3);
       }
       h1{
           font-size:48px;
           margin-bottom:20px;
           color:#ffffff;
       }
       p{
           font-size:20px;
           margin-bottom:30px;
           color:#dbeafe;
       }
       .tech-stack{
           display:flex;
           justify-content:center;
           flex-wrap:wrap;
           gap:15px;
           margin-top:20px;
       }
       .card{
           background:white;
           color:#111827;
           padding:15px 25px;
           border-radius:12px;
           font-weight:bold;
           min-width:150px;
           transition:0.3s;
       }
       .card:hover{
           transform:scale(1.05);
           background:#2563eb;
           color:white;
       }
       .status{
           margin-top:35px;
           padding:15px;
           background:#16a34a;
           border-radius:10px;
           font-size:20px;
           font-weight:bold;
       }
       .version{
           margin-top:20px;
           display:inline-block;
           padding:10px 20px;
           background:#111827;
           border:1px solid #60a5fa;
           border-radius:10px;
           font-size:18px;
           font-weight:bold;
           color:#93c5fd;
       }
       footer{
           margin-top:30px;
           font-size:14px;
           color:#cbd5e1;
       }
</style>
</head>
<body>
<div class="container">
<h1>🚀 Self-Healing CI/CD Pipeline</h1>
<p>
       Intelligent Automated Deployment & Recovery Platform
</p>
<div class="tech-stack">
<div class="card">Jenkins</div>
<div class="card">Ansible</div>
<div class="card">Datadog</div>
<div class="card">ServiceNow</div>
<div class="card">AWX</div>
<div class="card">Linux</div>
</div>
<div class="status">
       ✅ Application Status : HEALTHY
</div>
<!-- VERSION SECTION -->
<div class="version">
       🔖 Release Version : v1.0.0
</div>
<footer>
       Developed for Automation Demo | Self-Healing Infrastructure Monitoring
</footer>
</div>
</body>
</html>
